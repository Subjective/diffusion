<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diffusion · wireframe</title>
<style>
  :root {
    --sans: "Söhne", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "Söhne Mono", ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    --bg: #ffffff;
    --panel: #f9f9f9;
    --surface: #ffffff;
    --text: #0d0d0d;
    --muted: #5d5d5d;
    --subtle: #8f8f8f;
    --border: #ececec;
    --border-strong: #e0e0e0;
    --hover: rgba(0,0,0,.04);
    --chip: #f0f0f0;
    --solid: #0d0d0d;
    --solid-fg: #ffffff;
    --brand: #10a37f;
    --hl: rgba(37,99,235,.10);
    --hl-flash: rgba(37,99,235,.24);
    --hl-bar: #2563eb;
    --add: rgba(16,163,127,.08);
    --del: rgba(239,68,68,.07);
    --add-fg: #0a7a5c;
    --del-fg: #d03b3b;
    --t-k: #7c3aed; --t-s: #0a7a5c; --t-n: #b45309; --t-c: #8f8f8f; --t-f: #2563eb; --t-t: #b4235a;
    --shadow: 0 10px 30px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.06);
  }
  :root.dark {
    --bg: #212121;
    --panel: #181818;
    --surface: #2a2a2a;
    --text: #ececec;
    --muted: #b4b4b4;
    --subtle: #8a8a8a;
    --border: rgba(255,255,255,.08);
    --border-strong: rgba(255,255,255,.14);
    --hover: rgba(255,255,255,.05);
    --chip: #303030;
    --solid: #ececec;
    --solid-fg: #0d0d0d;
    --hl: rgba(96,165,250,.16);
    --hl-flash: rgba(96,165,250,.32);
    --hl-bar: #60a5fa;
    --add: rgba(16,163,127,.13);
    --del: rgba(239,68,68,.12);
    --add-fg: #4fd1a5;
    --del-fg: #f87171;
    --t-k: #c4a7ff; --t-s: #6ee7b7; --t-n: #fbbf24; --t-c: #7a7a7a; --t-f: #93c5fd; --t-t: #f9a8d4;
    --shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: 14px/1.5 var(--sans); color: var(--text); background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .ic { display: block; flex: none; }
  .hidden { display: none !important; }
  .grow { flex: 1; }
  code { font: 12.5px var(--mono); background: var(--chip); padding: 1px 5px; border-radius: 5px; }

  /* ---------- buttons ---------- */
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px; display: inline-grid; place-items: center;
    color: var(--muted); transition: background .12s, color .12s;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn.sm { width: 26px; height: 26px; border-radius: 6px; }
  .icon-btn.solid { background: var(--solid); color: var(--solid-fg); border-radius: 999px; }
  .icon-btn.solid:hover { opacity: .85; }
  .icon-btn.on { color: var(--text); background: var(--hover); }

  /* ---------- top bar ---------- */
  .top {
    height: 56px; flex: none; display: flex; align-items: center; gap: 16px;
    padding: 0 12px 0 16px; border-bottom: 1px solid var(--border);
  }
  .brand { width: 30px; height: 30px; border-radius: 9px; background: var(--solid); color: var(--solid-fg); display: grid; place-items: center; }
  .url {
    margin: 0 auto; width: min(600px, 48vw); height: 40px; display: flex; align-items: center; gap: 10px;
    padding: 0 4px 0 14px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface);
    color: var(--subtle);
  }
  .url:focus-within { border-color: var(--subtle); }
  .url input { flex: 1; border: 0; outline: 0; background: transparent; font: 14px var(--sans); color: var(--text); }
  .top-r { display: flex; gap: 2px; }

  /* ---------- layout ---------- */
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 360px minmax(0,1fr) var(--chat-w, 380px); }
  .app.no-chat { grid-template-columns: 360px minmax(0,1fr) 0; }
  .app.no-chat .chat { display: none; }

  /* ---------- guide pane ---------- */
  .guide { overflow: auto; background: var(--panel); border-right: 1px solid var(--border); padding: 20px 16px 48px; }
  .pr h1 { font-size: 17px; line-height: 1.35; font-weight: 600; margin: 0 4px 8px; letter-spacing: -.01em; }
  .meta { display: flex; align-items: center; gap: 8px; margin: 0 4px; color: var(--subtle); font-size: 12.5px; }
  .avatar { width: 18px; height: 18px; border-radius: 50%; background: #d9d3f5; color: #4a3aa8; font-size: 9px; font-weight: 700; display: grid; place-items: center; }
  .n-add { color: var(--add-fg); font-family: var(--mono); font-size: 12px; }
  .n-del { color: var(--del-fg); font-family: var(--mono); font-size: 12px; }
  .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--border-strong); }

  .sec { margin-top: 22px; }
  .sec-h { display: flex; align-items: center; gap: 6px; margin: 0 4px 8px; color: var(--subtle); font-size: 11.5px; font-weight: 500; letter-spacing: .02em; }
  .sec-h .grow + * { font-family: var(--mono); }
  .tldr { margin: 0 4px; font-size: 14px; line-height: 1.55; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border); font-size: 12.5px; color: var(--muted);
  }
  .chip.warn { color: #b45309; border-color: rgba(180,83,9,.25); background: rgba(245,158,11,.07); }
  :root.dark .chip.warn { color: #fbbf24; border-color: rgba(251,191,36,.25); background: rgba(251,191,36,.07); }

  .flow { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 6px 4px; }
  .flow svg { width: 100%; display: block; }
  .fn { cursor: pointer; }
  .fn rect { fill: var(--surface); stroke: var(--border-strong); transition: fill .12s, stroke .12s; }
  .fn text { fill: var(--text); font: 11.5px var(--mono); }
  .fn .num circle { fill: var(--chip); }
  .fn .num text { font: 600 9.5px var(--sans); fill: var(--muted); text-anchor: middle; }
  .fn.hover rect { fill: var(--hl); stroke: var(--hl-bar); }
  .fn.active rect { stroke: var(--text); stroke-width: 1.5; }
  .fn.active .num circle { fill: var(--solid); }
  .fn.active .num text { fill: var(--solid-fg); }
  .fe { fill: none; stroke: var(--subtle); stroke-width: 1.2; }
  .fe.err { stroke: var(--del-fg); stroke-dasharray: 3 3; }
  .mk { fill: var(--subtle); } .mk.err { fill: var(--del-fg); }
  .fl { font: 10px var(--sans); fill: var(--subtle); }
  .fl.err { fill: var(--del-fg); }

  .progress { flex: 0 0 56px; height: 3px; background: var(--border-strong); border-radius: 3px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .25s; }

  .step {
    position: relative; display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: start;
    padding: 10px 8px 10px 10px; border-radius: 12px; border: 1px solid transparent; cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .step + .step { margin-top: 2px; }
  .step:hover, .step.hover { background: var(--hover); }
  .step.active { background: var(--surface); border-color: var(--border-strong); }
  .step .num {
    width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface);
    display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 1px;
  }
  .step.active .num { background: var(--solid); border-color: var(--solid); color: var(--solid-fg); }
  .step.done .num { background: var(--brand); border-color: var(--brand); color: #fff; }
  .step .t { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
  .step .t .ic { color: var(--subtle); }
  .step .s { color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 2px; }
  .step .s code { font-size: 11.5px; }
  .refs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .ref { font: 11px var(--mono); color: var(--subtle); background: var(--chip); padding: 1px 6px; border-radius: 5px; }
  .step .acts { display: flex; flex-direction: column; gap: 2px; }
  .step .acts .ask { opacity: 0; }
  .step:hover .acts .ask { opacity: 1; }
  .step.done .t { color: var(--muted); }

  .skip-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; color: var(--subtle);
    font: 12px var(--mono); cursor: pointer;
  }
  .skip-row:hover { background: var(--hover); color: var(--muted); }
  .skip-row .cnt { margin-left: auto; }

  /* generating state */
  .gen { padding: 24px 6px; }
  .gen-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; color: var(--subtle); font-size: 13px; }
  .gen-row .dot-i { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); }
  .gen-row.cur { color: var(--text); }
  .gen-row.cur .dot-i { border-color: var(--subtle); }
  .gen-row.done .dot-i { color: var(--brand); }
  .gen-row .spin { margin-left: auto; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade-in > * { animation: fadeUp .35s both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } }

  /* ---------- diff pane ---------- */
  .diffpane { overflow: auto; position: relative; }
  .toolbar {
    position: sticky; top: 0; z-index: 4; height: 44px; display: flex; align-items: center; gap: 4px;
    padding: 0 12px 0 20px; background: var(--bg); border-bottom: 1px solid var(--border); color: var(--subtle); font-size: 12.5px;
  }
  .toolbar .lbl { display: flex; align-items: center; gap: 6px; }
  .files { padding: 12px 16px 120px; }
  .files.hide-skip .file.skip { display: none; }
  .file { border: 1px solid var(--border); border-radius: 12px; overflow: clip; margin-bottom: 12px; background: var(--bg); }
  .file-h {
    position: sticky; top: 44px; z-index: 3; height: 40px; display: flex; align-items: center; gap: 8px;
    padding: 0 8px 0 10px; background: var(--panel); border-bottom: 1px solid var(--border); cursor: pointer; color: var(--subtle);
  }
  .file.collapsed .file-h { border-bottom-color: transparent; }
  .file.collapsed .file-b { display: none; }
  .file.collapsed .chev { transform: rotate(-90deg); }
  .chev { transition: transform .15s; }
  .path { font: 12.5px var(--mono); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .path .dir { color: var(--subtle); }
  .file.skip .path { color: var(--subtle); }
  .cnt { font: 11.5px var(--mono); white-space: nowrap; }
  .cnt .a { color: var(--add-fg); } .cnt .d { color: var(--del-fg); }
  .badges { display: flex; gap: 3px; }
  .viewed.on { color: var(--brand); }

  table.diff { width: 100%; border-collapse: collapse; font: 12.5px/20px var(--mono); }
  td { padding: 0; vertical-align: top; }
  td.mark { width: 26px; text-align: center; padding-top: 2px; }
  td.no { width: 44px; padding: 0 8px; text-align: right; color: var(--subtle); user-select: none; font-size: 11.5px; opacity: .8; }
  td.code { position: relative; white-space: pre; padding: 0 16px 0 24px; }
  .sg { position: absolute; left: 9px; color: var(--subtle); user-select: none; }
  tr.add td { background-color: var(--add); }
  tr.del td { background-color: var(--del); }
  tr.add .sg { color: var(--add-fg); } tr.del .sg { color: var(--del-fg); }
  tr.hh td { background: var(--panel); color: var(--subtle); font-size: 11.5px; padding: 3px 12px; }
  tr.hh td span { color: var(--muted); }
  tr.hl td, tr.pin td, tr.sel td { background-image: linear-gradient(var(--hl), var(--hl)); }
  tr.hl td.mark, tr.pin td.mark, tr.sel td.mark { box-shadow: inset 2px 0 0 var(--hl-bar); }
  tr.flash td.code, tr.flash td.no { animation: flash 1.1s ease-out; }
  @keyframes flash { from { box-shadow: inset 0 0 0 100vmax var(--hl-flash); } to { box-shadow: inset 0 0 0 100vmax transparent; } }
  .ask-btn {
    position: absolute; left: -11px; top: 1px; width: 20px; height: 18px; border-radius: 6px;
    background: var(--hl-bar); color: #fff; display: none; place-items: center; z-index: 1;
  }
  tr.ln:hover .ask-btn { display: grid; }
  .t-k { color: var(--t-k); } .t-s { color: var(--t-s); } .t-n { color: var(--t-n); }
  .t-c { color: var(--t-c); font-style: italic; } .t-f { color: var(--t-f); } .t-t { color: var(--t-t); }

  .dot {
    display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%;
    background: var(--solid); color: var(--solid-fg); font: 600 9.5px var(--sans); cursor: pointer;
  }
  .dot.sm { width: 15px; height: 15px; font-size: 9px; background: var(--chip); color: var(--muted); }
  .dot.sm:hover { background: var(--solid); color: var(--solid-fg); }

  /* ---------- ask popup ---------- */
  .ask-pop {
    position: fixed; z-index: 50; width: 360px; background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 16px; box-shadow: var(--shadow); padding: 8px; animation: pop .14s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
  .ask-ctx { display: flex; align-items: center; gap: 6px; padding: 2px 4px 8px 6px; font: 11.5px var(--mono); color: var(--subtle); }
  .ask-ctx b { color: var(--text); font-weight: 500; }
  .ask-in { display: flex; align-items: center; gap: 6px; }
  .ask-in input {
    flex: 1; height: 36px; border: 1px solid var(--border); border-radius: 999px; padding: 0 14px; outline: 0;
    background: var(--bg); color: var(--text); font: 14px var(--sans);
  }
  .ask-in input:focus { border-color: var(--subtle); }

  /* ---------- chat ---------- */
  .chat { position: relative; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--border); background: var(--bg); }
  .chat-h { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--border); color: var(--subtle); }
  .msgs { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
  .empty { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 18px; color: var(--subtle); }
  .empty .big { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-strong); display: grid; place-items: center; }
  .sugg { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .sugg button {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--border-strong);
    border-radius: 999px; font-size: 13px; color: var(--muted);
  }
  .sugg button:hover { background: var(--hover); color: var(--text); }
  .msg.user { align-self: flex-end; max-width: 88%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .bubble { background: var(--chip); padding: 9px 14px; border-radius: 18px; font-size: 14px; }
  .ctx-card {
    width: 100%; min-width: 220px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer;
    background: var(--surface); transition: border-color .12s;
  }
  .ctx-card:hover { border-color: var(--hl-bar); }
  .ctx-card .h { display: flex; align-items: center; gap: 6px; padding: 6px 10px; font: 11.5px var(--mono); color: var(--muted); }
  .ctx-card .h span { color: var(--subtle); margin-left: auto; }
  .ctx-card pre {
    margin: 0; padding: 6px 10px 8px; font: 11.5px/18px var(--mono); color: var(--muted); max-height: 62px; overflow: hidden;
    border-top: 1px solid var(--border); -webkit-mask-image: linear-gradient(#000 60%, transparent);
  }
  .msg.ai { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 14px; line-height: 1.6; }
  .ai-av { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border-strong); display: grid; place-items: center; color: var(--text); }
  .ai-body { padding-top: 2px; }
  .ai-body code { font-size: 12px; }
  .cursor { display: inline-block; width: 7px; height: 14px; background: var(--text); border-radius: 2px; vertical-align: -2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .composer-wrap { padding: 12px 12px 14px; }
  .composer {
    display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 16px; border: 1px solid var(--border-strong);
    border-radius: 24px; background: var(--surface);
  }
  .composer:focus-within { border-color: var(--subtle); }
  .composer textarea {
    flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--text); font: 14px/22px var(--sans);
    padding: 5px 0; max-height: 140px;
  }

  /* ---------- drag-to-range ---------- */
  .ask-btn { cursor: grab; }
  body.dragging, body.dragging * { cursor: ns-resize !important; user-select: none !important; }
  body.dragging tr.ln:hover .ask-btn { display: none; }
  body.dragging tr.drag-origin .ask-btn { display: grid; }
  .drag-tip {
    position: fixed; z-index: 60; pointer-events: none; padding: 2px 7px; border-radius: 6px;
    background: var(--solid); color: var(--solid-fg); font: 11px var(--mono);
  }

  /* ---------- questions: badges, queue, answers ---------- */
  tr.qd td.mark { box-shadow: inset 2px 0 0 var(--border-strong); }
  tr.qd.hl td.mark, tr.qd.pin td.mark, tr.qd.sel td.mark { box-shadow: inset 2px 0 0 var(--hl-bar); }
  .qbs { position: absolute; right: 8px; top: 1px; display: flex; gap: 4px; }
  .qb {
    height: 18px; padding: 0 6px 0 4px; border-radius: 999px; display: inline-flex; align-items: center; gap: 3px;
    font: 600 10px/1 var(--sans); background: var(--solid); color: var(--solid-fg); border: 1px solid transparent;
  }
  .qb.s-staged { background: var(--surface); color: var(--muted); border: 1px dashed var(--subtle); }
  .qb.s-pending { background: var(--chip); color: var(--muted); }
  .qb.s-pending .ic { animation: spin .8s linear infinite; }
  .qb.hover { outline: 2px solid var(--hl-bar); outline-offset: 1px; }
  .qn {
    display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
    background: var(--solid); color: var(--solid-fg); font: 600 9.5px/1 var(--sans); flex: none;
  }
  .qn.staged { background: var(--surface); color: var(--muted); border: 1px dashed var(--subtle); }

  .tray { border: 1px solid var(--border-strong); border-radius: 16px; margin-bottom: 8px; padding: 6px; background: var(--panel); animation: pop .14s ease-out; }
  .tray-h { display: flex; align-items: center; gap: 6px; padding: 0 0 4px 8px; color: var(--subtle); font-size: 12px; }
  .q-row {
    display: grid; grid-template-columns: auto auto minmax(0,1fr) auto; align-items: center; gap: 8px;
    padding: 4px 4px 4px 8px; border-radius: 10px; cursor: pointer; font-size: 13px;
  }
  .q-row:hover, .q-row.hover { background: var(--hover); }
  .q-row .ref { font: 11px var(--mono); color: var(--subtle); white-space: nowrap; }
  .q-row .qt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-row .x { opacity: 0; } .q-row:hover .x { opacity: 1; }
  #chatSend, #askSend { position: relative; }
  .send-n {
    position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px;
    background: var(--hl-bar); color: #fff; font: 600 9.5px/1 var(--sans); display: grid; place-items: center; border: 2px solid var(--surface);
  }

  /* ---------- chat: resize + history ---------- */
  .resizer { position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 7; }
  .resizer::after { content: ''; position: absolute; left: 3px; top: 0; bottom: 0; width: 2px; transition: background .12s; }
  .resizer:hover::after, body.resizing .resizer::after { background: var(--hl-bar); }
  body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
  .thread { display: flex; flex-direction: column; gap: 18px; }
  .hist { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; z-index: 6; overflow: auto; padding: 8px; background: var(--bg); animation: pop .14s ease-out; }
  .h-item { padding: 9px 10px; border-radius: 10px; cursor: pointer; }
  .h-item + .h-item { margin-top: 2px; }
  .h-item:hover { background: var(--hover); }
  .h-item.active { background: var(--chip); }
  .h-t { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h-m { display: flex; align-items: center; gap: 10px; margin-top: 3px; color: var(--subtle); font: 11.5px var(--mono); }
  .h-m span { display: inline-flex; align-items: center; gap: 4px; }

  .msg.user { gap: 12px; }

const KW = /^(import|from|export|const|let|class|private|public|async|await|function|return|if|try|catch|throw|new|extends|interface|true|false|null|typeof|as)$/;
function hl(src) {
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`)|(\b\d[\d_]*\b)|([A-Za-z_$][\w$]*)(?=\s*[(<])|([A-Za-z_$][\w$]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += `<span class="t-c">${esc(t)}</span>`;
    else if (m[2]) out += `<span class="t-s">${esc(t)}</span>`;
    else if (m[3]) out += `<span class="t-n">${t}</span>`;
    else if (KW.test(t)) out += `<span class="t-k">${t}</span>`;
    else if (m[4]) out += `<span class="t-f">${t}</span>`;
    else if (/^[A-Z]/.test(t)) out += `<span class="t-t">${t}</span>`;
    else out += t;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

/* =================================================================
   Render: diff
   ================================================================= */
let totAdd = 0, totDel = 0;
function renderFiles() {
  $('#files').innerHTML = FILES.map(f => {
    let rows = '', add = 0, del = 0;
    for (const h of f.hunks) {
      const lines = h.text.split('\n');
      const oc = lines.filter(l => l[0] !== '+').length, nc = lines.filter(l => l[0] !== '-').length;
      rows += `<tr class="hh"><td colspan="4">@@ -${h.old},${oc} +${h.nw},${nc} @@ <span>${esc(h.ctx)}</span></td></tr>`;
      let o = h.old, n = h.nw, lastNew = h.nw - 1;
      for (const raw of lines) {
        const t = raw === '' ? ' ' : raw[0], code = raw.slice(1);
        if (t === '+') { add++; rows += row('add', '', n, n, code, f.path); lastNew = n++; }
        else if (t === '-') { del++; rows += row('del', o++, '', lastNew + .5, code, f.path); }
        else { rows += row('ctx', o++, n, n, code, f.path); lastNew = n++; }
      }
    }
    totAdd += add; totDel += del;
    const dir = f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/') + 1) : '';
    const steps = STEPS.filter(s => s.refs.some(r => r.file === f.path)).map(s => s.id);
    const lead = f.skip ? ic(f.skip === 'lockfile' ? 'lock' : 'camera', 14) : ic('file-code', 14);
    f.add = add; f.del = del;
    return `<section class="file${f.skip ? ' skip collapsed' : ''}" data-path="${f.path}">
      <div class="file-h">
        <span class="chev">${ic('chevron-down', 14)}</span>${lead}
        <span class="path"><span class="dir">${dir}</span>${base(f.path)}</span>
        <span class="cnt"><span class="a">+${add}</span> <span class="d">−${del}</span></span>
        <span class="badges">${steps.map(s => `<span class="dot sm" data-step="${s}">${s}</span>`).join('')}</span>
        <span class="grow"></span>
        <button class="icon-btn sm viewed" title="Viewed">${ic('circle', 15)}</button>
      </div>
      <div class="file-b"><table class="diff">${rows}</table></div>
    </section>`;
  }).join('');

  // step markers in the gutter, at the first line of each ref
  for (const s of STEPS) for (const r of s.refs) {
    const first = rowsFor(r)[0];
    if (first && !first.querySelector(`.dot[data-step="${s.id}"]`))
      first.querySelector('.mark').insertAdjacentHTML('beforeend', `<span class="dot" data-step="${s.id}" title="Step ${s.id}">${s.id}</span>`);
  }
  $('#totAdd').textContent = '+' + totAdd;
  $('#totDel').textContent = '−' + totDel;
  $('#fileCount').textContent = FILES.length;
  applyOrder(GUIDE_ORDER);
}
function row(type, o, n, pos, code, path) {
  const sign = type === 'add' ? '+' : type === 'del' ? '−' : '';
  return `<tr class="ln ${type}" data-file="${path}" data-pos="${pos}"${n !== '' ? ` data-new="${n}"` : ''}${o !== '' ? ` data-old="${o}"` : ''}>
    <td class="mark"></td><td class="no">${o}</td><td class="no">${n}</td>
    <td class="code"><button class="ask-btn" title="Click, or drag to select lines">${ic('message-circle', 12)}</button><span class="sg">${sign}</span><span class="src">${hl(code) || ' '}</span></td></tr>`;
}
const fileEl = p => $(`.file[data-path="${CSS.escape(p)}"]`);
const rowsFor = r => $$(`tr.ln[data-file="${CSS.escape(r.file)}"]`).filter(x => +x.dataset.pos >= r.from && +x.dataset.pos <= r.to);
const stepRows = id => STEPS.find(s => s.id === id).refs.flatMap(rowsFor);
function applyOrder(order) { const root = $('#files'); order.forEach(p => root.appendChild(fileEl(p))); }

/* =================================================================
   Linking: hover → highlight, click → scroll/expand/pin
   ================================================================= */
let hoverStep = null, pinStep = null;
function setHover(id) {
  if (id === hoverStep) return;
  hoverStep = id;
  $$('tr.hl').forEach(r => r.classList.remove('hl'));
  $$('.step.hover, .fn.hover').forEach(e => e.classList.remove('hover'));
  if (id == null) return;
  stepRows(id).forEach(r => r.classList.add('hl'));
  $$(`.step[data-step="${id}"], .fn[data-step="${id}"]`).forEach(e => e.classList.add('hover'));
}
function syncActive() {
  $$('.step.active, .fn.active').forEach(e => e.classList.remove('active'));
  if (pinStep != null) $$(`.step[data-step="${pinStep}"], .fn[data-step="${pinStep}"]`).forEach(e => e.classList.add('active'));
}
function focusRows(rows) {
  if (!rows.length) return;
  [...new Set(rows.map(r => r.closest('.file')))].forEach(f => { f.classList.remove('collapsed'); f.closest('.files').classList.remove('hide-skip'); });
  rows[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
  rows.forEach(r => { r.classList.remove('flash'); void r.offsetWidth; r.classList.add('flash'); });
}
function focusStep(id, fromDiff) {
  pinStep = pinStep === id && !fromDiff ? null : id;
  $$('tr.pin').forEach(r => r.classList.remove('pin'));
  syncActive();
  if (pinStep == null) return;
  const rows = stepRows(id);
  rows.forEach(r => r.classList.add('pin'));
  focusRows(rows);
  if (fromDiff) $(`.step[data-step="${id}"]`).scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

document.addEventListener('mouseover', e => {
  if (drag) return;
  const qEl = e.target.closest('[data-q]');
  if (qEl) { setHover(null); setHoverQ(+qEl.dataset.q); return; }
  setHoverQ(null);
  const el = e.target.closest('[data-step]');
  setHover(el ? +el.dataset.step : null);
});
document.addEventListener('click', e => {
  const t = e.target;
  const doneBtn = t.closest('[data-done]');
  if (doneBtn) { const id = +doneBtn.dataset.done; done.has(id) ? done.delete(id) : done.add(id); renderSteps(); return; }
  const askStep = t.closest('[data-askstep]');
  if (askStep) { const s = STEPS.find(x => x.id === +askStep.dataset.askstep); sendQs([newQ(`Walk me through step ${s.id}.`, { step: s }, true)]); return; }
  const un = t.closest('[data-unstage]');
  if (un) { unstage(+un.dataset.unstage); return; }
  const qEl = t.closest('[data-q]');
  if (qEl) { const id = +qEl.dataset.q; qEl.classList.contains('qb') ? revealQ(id) : focusRows(qRows(getQ(id))); return; }
  const goto = t.closest('[data-goto]');
  if (goto) { const f = fileEl(goto.dataset.goto); f.closest('.files').classList.remove('hide-skip'); f.classList.remove('collapsed'); f.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
  const stepEl = t.closest('[data-step]');
  if (stepEl) { focusStep(+stepEl.dataset.step, !!t.closest('.diffpane')); return; }
  const viewed = t.closest('.viewed');
  if (viewed) {
    const f = viewed.closest('.file'), on = !viewed.classList.contains('on');
    viewed.classList.toggle('on', on); viewed.innerHTML = ic(on ? 'circle-check' : 'circle', 15);
    f.classList.toggle('collapsed', on); return;
  }
  const fh = t.closest('.file-h');
  if (fh) { fh.parentElement.classList.toggle('collapsed'); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (drag) { endDrag(); closeAsk(); } closeAsk(); pinStep = null; $$('tr.pin').forEach(r => r.classList.remove('pin')); syncActive(); }
  if (/input|textarea/i.test(document.activeElement.tagName)) return;
  if (e.key === 'j' || e.key === 'k') {
    const cur = pinStep ?? 0, nxt = Math.min(STEPS.length, Math.max(1, cur + (e.key === 'j' ? 1 : -1)));
    focusStep(nxt, true);
  }
});

/* =================================================================
   Select-to-ask: text selection, or press-and-drag the line bubble
   ================================================================= */
let askCtx = null, drag = null;
const rowOf = n => (n?.nodeType === 3 ? n.parentElement : n)?.closest?.('tr.ln');
const lineNo = r => +(r.dataset.new || r.dataset.old);
const rangeOf = rows => { const n = rows.map(lineNo); return [Math.min(...n), Math.max(...n)]; };
const rangeTxt = (from, to) => from === to ? `L${from}` : `L${from}–${to}`;

$('#files').addEventListener('mouseup', e => setTimeout(() => {
  const sel = getSelection();
  if (drag || !sel || sel.isCollapsed || !sel.toString().trim()) return;
  const a = rowOf(sel.anchorNode), b = rowOf(sel.focusNode);
  if (!a || !b || a.dataset.file !== b.dataset.file) return;
  const all = $$('tr.ln', a.closest('table'));
  const [i, j] = [all.indexOf(a), all.indexOf(b)].sort((x, y) => x - y);
  openAsk(all.slice(i, j + 1), e.clientX, e.clientY);
}));

$('#files').addEventListener('mousedown', e => {
  const btn = e.target.closest('.ask-btn');
  if (!btn || e.button !== 0) return;
  e.preventDefault();
  closeAsk(); getSelection().removeAllRanges();
  const origin = btn.closest('tr.ln');
  const tip = document.body.appendChild(Object.assign(document.createElement('div'), { className: 'drag-tip' }));
  drag = { origin, end: origin, all: $$('tr.ln', origin.closest('table')), tip, x: e.clientX, y: e.clientY };
  document.body.classList.add('dragging');
  origin.classList.add('drag-origin');
  paintDrag(e.clientX, e.clientY);
  drag.timer = setInterval(autoScroll, 16);
});
function dragRows() {
  const i = drag.all.indexOf(drag.origin), j = drag.all.indexOf(drag.end);
  return drag.all.slice(Math.min(i, j), Math.max(i, j) + 1);
}
function paintDrag(x, y) {
  drag.x = x; drag.y = y;
  const r = document.elementFromPoint?.(x, y)?.closest('tr.ln');
  if (r && drag.all.includes(r)) drag.end = r;
  $$('tr.sel').forEach(r => r.classList.remove('sel'));
  const rows = dragRows();
  rows.forEach(r => r.classList.add('sel'));
  drag.tip.textContent = rangeTxt(...rangeOf(rows));
  drag.tip.style.left = x + 14 + 'px';
  drag.tip.style.top = y - 10 + 'px';
}
function autoScroll() {
  const pane = $('#diffPane'), b = pane.getBoundingClientRect();
  const dy = drag.y < b.top + 110 ? -14 : drag.y > b.bottom - 40 ? 14 : 0;
  if (dy) { pane.scrollTop += dy; paintDrag(drag.x, drag.y); }
}
function endDrag() {
  clearInterval(drag.timer); drag.tip.remove();
  drag.origin.classList.remove('drag-origin');
  document.body.classList.remove('dragging');
  drag = null;
}
document.addEventListener('mousemove', e => { if (drag) paintDrag(e.clientX, e.clientY); });
document.addEventListener('mouseup', e => {
  if (!drag) return;
  const rows = dragRows();
  endDrag();
  openAsk(rows, e.clientX, e.clientY);
});

function ctxFromRows(rows) {
  const [from, to] = rangeOf(rows);
  return {
    file: rows[0].dataset.file, from, to,
    pfrom: +rows[0].dataset.pos, pto: +rows[rows.length - 1].dataset.pos,
    code: rows.map(r => r.querySelector('.src').textContent).join('\n'),
  };
}
function openAsk(rows, x, y) {
  closeAsk();
  askCtx = ctxFromRows(rows);
  rows.forEach(r => r.classList.add('sel'));
  $('#askFile').textContent = base(askCtx.file);
  $('#askLines').textContent = rangeTxt(askCtx.from, askCtx.to);
  const pop = $('#askPop');
  pop.classList.remove('hidden');
  pop.style.left = Math.min(x, innerWidth - 376) + 'px';
  pop.style.top = Math.min(y + 12, innerHeight - 120) + 'px';
  $('#askIn').value = '';
  setTimeout(() => $('#askIn').focus(), 0);
}
function closeAsk() {
  $('#askPop').classList.add('hidden');
  $$('tr.sel').forEach(r => r.classList.remove('sel'));
}
function submitAsk(stage) {
  const q = $('#askIn').value.trim() || 'Explain this.';
  const ctx = askCtx; closeAsk(); getSelection().removeAllRanges();
  const item = newQ(q, ctx, true);
  stage ? stageQ(item) : sendQs([item]);
}
$('#askSend').onclick = () => submitAsk(false);
$('#askStage').onclick = () => submitAsk(true);
$('#askClose').onclick = closeAsk;
$('#askIn').addEventListener('keydown', e => { if (e.key === 'Enter') submitAsk(e.shiftKey); });
document.addEventListener('mousedown', e => { if (!e.target.closest('#askPop') && !e.target.closest('.ask-btn')) closeAsk(); });

/* =================================================================
   Chats: each owns its questions, line annotations, and thread.
   Questions stay linked to their lines (gutter badge ⇄ chat).
   Line comments can be queued and sent together; chat messages send immediately.
   ================================================================= */
const chats = [];
let cur = null, chatSeq = 0, qSeq = 0;
function newChat() {
  if (cur && !cur.Q.length) return showChat(cur);
  const el = Object.assign(document.createElement('div'), { className: 'thread' });
  $('#msgs').appendChild(el);
  cur = { id: ++chatSeq, Q: [], n: 0, at: Date.now(), el };
  chats.push(cur);
  showChat(cur);
}
function showChat(c) {
  setHoverQ(null);
  cur = c;
  $$('#msgs .thread').forEach(t => t.classList.toggle('hidden', t !== c.el));
  $('#empty').classList.toggle('hidden', !!c.el.children.length);
  closeHistory();
  renderQueue(); renderBadges();
  $('#msgs').scrollTop = $('#msgs').scrollHeight;
}

function newQ(q, ctx, tagged) {
  const item = { id: ++qSeq, q, ctx, status: 'new', chat: cur.id };
  if (tagged) item.n = ++cur.n;
  cur.Q.push(item);
  return item;
}
const getQ = id => cur.Q.find(q => q.id === id);
const qRows = q => q.ctx?.file ? rowsFor({ file: q.ctx.file, from: q.ctx.pfrom, to: q.ctx.pto }) : q.ctx?.step ? stepRows(q.ctx.step.id) : [];
const refLabel = c => c?.file ? `${base(c.file)}:${c.from}${c.to !== c.from ? '–' + c.to : ''}` : c?.step ? `Step ${c.step.id}` : '';
const qn = q => q.n ? `<span class="qn${q.status === 'staged' ? ' staged' : ''}">${q.n}</span>` : '';
const staged = () => cur.Q.filter(q => q.status === 'staged');

function stageQ(item) { item.status = 'staged'; renderQueue(); renderBadges(); openChat(); }
function unstage(id) { const i = cur.Q.findIndex(q => q.id === id); if (i >= 0) cur.Q.splice(i, 1); renderQueue(); renderBadges(); }

function renderQueue() {
  const s = staged();
  $('#tray').classList.toggle('hidden', !s.length);
  $('#trayN').textContent = s.length;
  $('#trayList').innerHTML = s.map(q => `
    <div class="q-row" data-q="${q.id}">${qn(q)}<span class="ref">${refLabel(q.ctx)}</span><span class="qt">${esc(q.q)}</span>
      <button class="icon-btn sm x" data-unstage="${q.id}" title="Remove">${ic('x', 13)}</button></div>`).join('');
  $('#chatSend').innerHTML = ic('arrow-up', 16) + (s.length ? `<span class="send-n">${s.length}</span>` : '');
  $('#chatSend').title = s.length ? `Send ${s.length}` : 'Send (↵)';
  $('#chatIn').placeholder = s.length ? 'Add a message, or send' : 'Ask anything';
}

function renderBadges() {
  $$('.qbs').forEach(e => e.remove());
  $$('tr.qd').forEach(r => r.classList.remove('qd'));
  for (const q of cur.Q) {
    if (!q.ctx?.file || q.status === 'new') continue;
    const rows = qRows(q);
    if (!rows.length) continue;
    rows.forEach(r => r.classList.add('qd'));
    const td = rows[0].querySelector('td.code');
    const box = td.querySelector('.qbs') || td.appendChild(Object.assign(document.createElement('span'), { className: 'qbs' }));
    const icon = q.status === 'pending' ? 'loader-circle' : q.status === 'staged' ? 'list-plus' : 'message-circle';
    box.insertAdjacentHTML('beforeend', `<button class="qb s-${q.status}" data-q="${q.id}">${ic(icon, 11)}${q.n}</button>`);
  }
  if (hoverQ != null) { const h = hoverQ; hoverQ = null; setHoverQ(h); }
}

let hoverQ = null;
function setHoverQ(id) {
  if (id === hoverQ) return;
  if (hoverQ != null) {
    $$('tr.hl').forEach(r => r.classList.remove('hl'));
    $$('[data-q].hover').forEach(e => e.classList.remove('hover'));
  }
  hoverQ = id;
  const q = id != null && getQ(id);
  if (!q) return;
  qRows(q).forEach(r => r.classList.add('hl'));
  $$(`[data-q="${id}"]`).forEach(e => e.classList.add('hover'));
}
const qflash = el => { if (!el) return; el.classList.remove('qflash'); void el.offsetWidth; el.classList.add('qflash'); };
function revealQ(id) {
  const q = getQ(id);
  openChat();
  const el = q.status === 'staged' ? $(`.q-row[data-q="${id}"]`) : $(`.ans[data-ans="${id}"]`);
  el?.scrollIntoView({ block: 'center', behavior: 'smooth' });
  qflash(el);
}

/* ---------- history ---------- */
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'now' : m < 60 ? m + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : Math.round(m / 1440) + 'd'; };
function renderHistory() {
  const list = chats.filter(c => c.Q.length || c === cur).sort((a, b) => b.at - a.at);
  $('#hist').innerHTML = list.map(c => {
    const anchored = c.Q.filter(q => q.ctx).length;
    return `<div class="h-item${c === cur ? ' active' : ''}" data-chat="${c.id}">
      <div class="h-t">${c.Q.length ? esc(c.Q[0].q) : 'New chat'}</div>
      <div class="h-m"><span>${ic('message-circle', 12)}${c.Q.length}</span>${anchored ? `<span>${ic('file-code', 12)}${anchored}</span>` : ''}<span class="grow"></span><span>${ago(c.at)}</span></div>
    </div>`;
  }).join('');
}
const closeHistory = () => { $('#hist').classList.add('hidden'); $('#histBtn').classList.remove('on'); };
$('#histBtn').onclick = () => {
  const open = $('#hist').classList.toggle('hidden') === false;
  $('#histBtn').classList.toggle('on', open);
  if (open) renderHistory();
};
$('#hist').addEventListener('click', e => { const it = e.target.closest('[data-chat]'); if (it) showChat(chats.find(c => c.id === +it.dataset.chat)); });

/* ---------- canned answers (engine streams these via SSE) ---------- */
const A = {
  err: '**Every** failure ends the session, including a transient network blip or a 5xx. Consider a short retry with backoff before calling `end()`.\n\nAlso: `refresh()` runs from a `setTimeout`, so this `throw` becomes an **unhandled rejection**. Nothing awaits it.',
  delay: '`delay` is clamped at 0, so a token that has already expired refreshes immediately. The 60s margin (`REFRESH_MARGIN_MS`) allows for clock skew.\n\nThere is no jitter, so tabs opened together will all refresh at the same moment.',
  expiry: '`expires_in` is in **seconds** per the auth API, so `* 1000` is right. `expiresAt` uses the client clock, which is fine because it is only compared against local `Date.now()`.',
  tests: 'Covered: the timer fires, and failure ends the session.\n\nNot covered: `end()` cancelling a pending timer, rescheduling after a successful refresh, and unit conversion in `withExpiry`.',
  risks: '1. `refresh()` throws inside a timer, so the rejection is unhandled.\n2. No retry on transient failures.\n3. No jitter, so multiple tabs hit `/auth/refresh` at the same time.',
  flow: '`login()` → tokens with `expiresAt` → `start()` → `scheduleRefresh()` sets a timer → `refresh()` calls `refreshTokens()` and reschedules itself. Any error → `end()`.',
};
function answerFor(q, ctx) {
  const code = ctx?.code || '', ql = q.toLowerCase();
  if (/catch|SessionExpiredError\(|this\.end/.test(code)) return A.err;
  if (/delay|REFRESH_MARGIN/.test(code)) return A.delay;
  if (/withExpiry|expires_in/.test(code)) return A.expiry;
  if (/test\(|vi\./.test(code) || ctx?.step?.kind === 'test') return A.tests;
  if (ctx?.step?.id === 2) return A.err;
  if (ctx?.step) return `**${ctx.step.title}**: ${ctx.step.summary.replace(/<\/?code>/g, '`')}\n\nNothing risky stands out here.`;
  if (ctx) {
    const s = STEPS.find(s => s.refs.some(r => r.file === ctx.file && ctx.pfrom <= r.to && ctx.pto >= r.from));
    return s ? `Part of **step ${s.id} · ${s.title}**: ${s.summary.replace(/<\/?code>/g, '`')}\n\nNothing risky stands out on these lines.`
             : 'This is context that the PR does not change.';
  }
  if (/risk/.test(ql)) return A.risks;
  if (/test/.test(ql)) return A.tests;
  return A.flow;
}
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');

/* ---------- send: one turn, N questions, answers stream in parallel ---------- */
const openChat = () => { $('#app').classList.remove('no-chat'); $('#chatBtn').classList.add('on'); };
function cardHtml(c) {
  if (c?.step) return `<div class="ctx-card"><div class="h">${ic(KIND_ICON[c.step.kind], 13)}Step ${c.step.id} · ${c.step.title}</div></div>`;
  if (c?.file) return `<div class="ctx-card"><div class="h">${ic('file-code', 13)}${base(c.file)}<span>${rangeTxt(c.from, c.to)}</span></div><pre>${esc(c.code)}</pre></div>`;
  return '';
}
function sendQs(qs) {
  if (!qs.length) return;
  openChat(); closeHistory();
  $('#empty').classList.add('hidden');
  cur.at = Date.now();
  if (qs.length > 1) qs.forEach(q => { if (!q.n) q.n = ++cur.n; });
  qs.forEach(q => q.status = 'pending');
  const thread = cur.el, msgs = $('#msgs');
  thread.insertAdjacentHTML('beforeend', `<div class="msg user">${qs.map(q => `
    <div class="q-item"${q.n ? ` data-q="${q.id}"` : ''}>${cardHtml(q.ctx)}<div class="bubble">${qn(q)}${esc(q.q)}</div></div>`).join('')}</div>`);
  thread.insertAdjacentHTML('beforeend', `<div class="msg ai"><div class="ai-av">${ic('sparkles', 14)}</div><div class="ai-body">${qs.map(q => `
    <div class="ans" data-ans="${q.id}">${q.n ? `<div class="ans-h" data-q="${q.id}">${qn(q)}${esc(refLabel(q.ctx) || q.q.slice(0, 28))}</div>` : ''}<div class="ans-t"><span class="cursor"></span></div></div>`).join('')}</div></div>`);
  msgs.scrollTop = msgs.scrollHeight;
  renderQueue(); renderBadges();
  qs.forEach((q, i) => stream(q, 500 + i * 450 + Math.random() * 400));
}
function stream(q, latency) {
  const out = $(`.ans[data-ans="${q.id}"] .ans-t`), msgs = $('#msgs');
  const words = answerFor(q.q, q.ctx).split(/(\s+)/);
  let i = 0;
  setTimeout(function tick() {
    if (!out.isConnected) return;
    const visible = q.chat === cur.id, stick = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 80;
    i += 2;
    out.innerHTML = md(words.slice(0, i).join('')) + (i < words.length ? '<span class="cursor"></span>' : '');
    if (visible && stick) msgs.scrollTop = msgs.scrollHeight;
    if (i < words.length) return setTimeout(tick, 28);
    q.status = 'answered';
    if (visible) renderBadges();
  }, latency);
}

/* ---------- composer: sends immediately; also flushes any queued line comments ---------- */
function sendComposer() {
  const ta = $('#chatIn'), text = ta.value.trim();
  const qs = staged();
  if (text) qs.push(newQ(text, null, qs.length > 0));
  if (!qs.length) return;
  ta.value = ''; ta.style.height = '';
  sendQs(qs);
}
$('#chatSend').onclick = sendComposer;
$('#chatIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendComposer(); } });
$('#chatIn').addEventListener('input', e => { e.target.style.height = ''; e.target.style.height = e.target.scrollHeight + 'px'; });
$$('.sugg button').forEach(b => b.onclick = () => sendQs([newQ(b.dataset.sugg, null, false)]));
$('#trayClear').onclick = () => staged().forEach(q => unstage(q.id));

/* =================================================================
   Chrome: theme, panels, toolbar, generate
   ================================================================= */
const root = document.documentElement;
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const setTheme = dark => { root.classList.toggle('dark', dark); $('#themeBtn').innerHTML = ic(dark ? 'sun' : 'moon', 17); store.set('rv-theme', dark ? 'dark' : 'light'); };
setTheme((store.get('rv-theme') ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark');
$('#themeBtn').onclick = () => setTheme(!root.classList.contains('dark'));
const toggleChat = () => { const off = $('#app').classList.toggle('no-chat'); $('#chatBtn').classList.toggle('on', !off); };
$('#chatBtn').onclick = toggleChat;

const CHAT_W = 380;
const setChatW = w => { w = Math.round(Math.max(300, Math.min(w, innerWidth - 360 - 420))); $('#app').style.setProperty('--chat-w', w + 'px'); return w; };
setChatW(+store.get('rv-chat-w') || CHAT_W);
$('#chatResize').addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  e.preventDefault();
  document.body.classList.add('resizing');
  let w;
  const move = e => { w = setChatW(innerWidth - e.clientX); };
  const up = () => {
    document.body.classList.remove('resizing');
    removeEventListener('mousemove', move); removeEventListener('mouseup', up);
    if (w) store.set('rv-chat-w', w);
  };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
});
$('#chatResize').addEventListener('dblclick', () => store.set('rv-chat-w', setChatW(CHAT_W)));
$('#closeChat').onclick = toggleChat;

let guideOrder = true;
$('#orderBtn').onclick = e => {
  guideOrder = !guideOrder;
  applyOrder(guideOrder ? GUIDE_ORDER : [...GUIDE_ORDER].sort());
  const b = $('#orderBtn'); b.innerHTML = ic(guideOrder ? 'route' : 'arrow-down-a-z', 15); b.title = guideOrder ? 'Order: guide' : 'Order: A–Z';
};
$('#skipBtn').onclick = () => { const on = $('#files').classList.toggle('hide-skip'); $('#skipBtn').classList.toggle('on', on); };
let allCollapsed = false;
$('#collapseBtn').onclick = () => { allCollapsed = !allCollapsed; $$('.file').forEach(f => f.classList.toggle('collapsed', allCollapsed || f.classList.contains('skip'))); };

const PIPE = [['git-pull-request', 'Fetch PR'], ['layers', 'Split hunks'], ['sparkles', 'Read & plan'], ['shield-check', 'Validate refs']];
$('#genBtn').onclick = () => {
  const g = $('#guide'), st = $('#genState');
  g.classList.add('hidden'); st.classList.remove('hidden');
  st.innerHTML = PIPE.map(([i, l]) => `<div class="gen-row"><span class="dot-i">${ic(i, 15)}</span>${l}<span class="spin hidden">${ic('loader-circle', 15)}</span></div>`).join('');
  const rows = $$('.gen-row', st);
  let k = 0;
  (function next() {
    rows.forEach((r, i) => {
      r.classList.toggle('done', i < k); r.classList.toggle('cur', i === k);
      r.querySelector('.spin').classList.toggle('hidden', i !== k);
      if (i < k) r.querySelector('.dot-i').innerHTML = ic('check', 15);
    });
    if (k++ < rows.length) return setTimeout(next, 550);
    setTimeout(() => { st.classList.add('hidden'); g.classList.remove('hidden'); g.classList.remove('fade-in'); void g.offsetWidth; g.classList.add('fade-in'); }, 250);
  })();
};

/* ---------- boot ---------- */
hydrateIcons();
renderFiles();
renderFlow();
renderSteps();
renderSkips();

const ctxAt = (file, from, to) => ctxFromRows(rowsFor({ file, from, to }));
function seedChat(ago, ...qs) {
  newChat();
  qs.forEach(([q, ctx]) => sendQs([newQ(q, ctx, !!ctx)]));
  cur.at = Date.now() - ago;
}
seedChat(2 * 3600e3, ['Is the unit conversion right?', ctxAt(C, 21, 27)], ['Should 5xx retry?', ctxAt(S, 26, 29)]);
seedChat(25 * 60e3, ['What are the risks in this PR?']);
newChat();
</script>
</body>
