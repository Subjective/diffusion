name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  wheel:
    runs-on: ubuntu-latest
    needs: [engine, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v6
      - run: make wheel
      - name: Smoke-test the wheel serves the UI
        run: |
          uv venv /tmp/w && uv pip install --python /tmp/w/bin/python dist/*.whl
          /tmp/w/bin/python -c "import diffusion.app as a; d = a._web_dist(); assert d and (d / 'index.html').is_file(), d"
          /tmp/w/bin/diffusion --help
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
